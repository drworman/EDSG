name: Release

# Two single-file binaries (organizer, participant) for three operating
# systems. The LGPL relinking requirement for Qt is satisfied under LGPLv3
# section 4(d)(1): the complete application source is public, the build specs
# live in packaging/, and PySide6 is a pip install away, so anyone can
# regenerate these binaries against their own build of Qt. The licence texts
# in licenses/ ship inside every archive. See docs/LICENSING.md before
# changing how these artefacts are produced.

on:
  push:
    # Tags are bare YYYYMMDD datestamps with no "v" prefix, so the
    # filter matches any tag starting with a digit. The verify job below
    # is what actually rejects a tag that does not match the version file.
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artefacts without publishing a release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify tag matches the version file
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Versions are YYYYMMDD datestamps; see CONTRIBUTING.md.
      - id: read
        name: Read and check the version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version file: ${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "${VERSION}" ]; then
              echo "::error::Tag '${TAG}' does not match the version file" \
                   "('${VERSION}'). Tags are bare datestamps with no 'v'" \
                   "prefix. Update 'version' or move the tag."
              exit 1
            fi
          fi

  build:
    name: Build ${{ matrix.app }} (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        app: [organizer, participant]
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64
          - app: organizer
            binary: EDSG-Organizer
          - app: participant
            binary: EDSG-Participant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 xvfb

      - name: Build single-file binary
        run: pyinstaller packaging/${{ matrix.app }}.spec --noconfirm --clean

      # --------------------------------------------------------------- #
      # Code signing. Every step is skipped when its secret is absent, so
      # forks build successfully without any credentials configured.
      # --------------------------------------------------------------- #

      - name: Sign Windows binary
        if: runner.os == 'Windows' && env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT)
          $path = Join-Path $env:RUNNER_TEMP "edsg-signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $signtool = Get-ChildItem `
            "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" |
            Select-Object -Last 1
          & $signtool.FullName sign /f $path /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist/${{ matrix.binary }}.exe"
          & $signtool.FullName verify /pa "dist/${{ matrix.binary }}.exe"
          Remove-Item $path -Force

      - name: Sign and notarise macOS app
        if: runner.os == 'macOS' && env.CERT != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/edsg.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # Hardened runtime is required for notarisation. Qt loads its
          # plugins at runtime, so the JIT and unsigned-memory entitlements
          # must be granted or the app is killed on launch.
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/entitlements.plist \
            --sign "$SIGN_IDENTITY" "dist/${{ matrix.binary }}.app"
          codesign --verify --deep --strict --verbose=2 \
            "dist/${{ matrix.binary }}.app"

          ditto -c -k --keepParent "dist/${{ matrix.binary }}.app" \
            "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" --wait
          xcrun stapler staple "dist/${{ matrix.binary }}.app"

          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notarize.zip"

      # --------------------------------------------------------------- #
      # Smoke test: prove the artefact actually starts. A binary that
      # builds but cannot import its own modules is the failure mode this
      # catches, and it is easy to ship without this step.
      # --------------------------------------------------------------- #

      - name: Smoke-test the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          chmod +x "dist/${{ matrix.binary }}"
          ACTUAL="$(xvfb-run -a "dist/${{ matrix.binary }}" --cli version)"
          EXPECTED="${{ needs.verify.outputs.version }}"
          echo "reported: '$ACTUAL' / expected: '$EXPECTED'"
          test -n "$ACTUAL" || { echo "::error::No output from the binary."; exit 1; }
          test "$ACTUAL" = "$EXPECTED"

      - name: Smoke-test the binary (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          chmod +x "dist/${{ matrix.binary }}"
          ACTUAL="$("dist/${{ matrix.binary }}" --cli version)"
          EXPECTED="${{ needs.verify.outputs.version }}"
          echo "reported: '$ACTUAL' / expected: '$EXPECTED'"
          test -n "$ACTUAL" || { echo "::error::No output from the binary."; exit 1; }
          test "$ACTUAL" = "$EXPECTED"

      # The Windows binaries are built windowed, so they start with no
      # console. src/edsg/win_console.py reattaches stdout for --cli; this
      # step is what proves it still works.
      #
      # Two ways of capturing are tried before giving up. Piping is the
      # normal path, but it depends on the console attachment behaving,
      # and that is the part that cannot be tested off Windows. Falling
      # back to a redirect to a file exercises the inherited-handle path
      # instead, so a regression in one does not block a release on the
      # other.
      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "${{ needs.verify.outputs.version }}"
          $exe = "dist/${{ matrix.binary }}.exe"

          $actual = (& $exe --cli version 2>&1 | Out-String).Trim()
          $exit = $LASTEXITCODE
          Write-Host "pipe capture : '$actual' (exit $exit)"

          if ([string]::IsNullOrWhiteSpace($actual)) {
            Write-Host "Pipe capture was empty; retrying with a file redirect."
            $tmp = Join-Path $env:RUNNER_TEMP "edsg-version.txt"
            & $exe --cli version > $tmp 2>&1
            $exit = $LASTEXITCODE
            $actual = (Get-Content $tmp -Raw).Trim()
            Write-Host "file capture : '$actual' (exit $exit)"
          }

          if ($exit -ne 0) {
            throw "Binary exited with code $exit."
          }
          if ([string]::IsNullOrWhiteSpace($actual)) {
            throw ("The binary produced no output by either method. A " +
                   "windowed Windows build cannot write to stdout unless " +
                   "it attaches to the parent console or picks up an " +
                   "inherited handle - check enable_console_output() in " +
                   "src/edsg/win_console.py.")
          }
          if ($actual -ne $expected) {
            throw "Version mismatch: got '$actual', expected '$expected'."
          }
          Write-Host "OK"

      # A tagged run produces the archives that become release assets.
      # A manual run does not: GitHub always zips whatever an artefact
      # step uploads, so building a tar.gz first hands Linux users a
      # tarball inside a zip for no reason. Uploading the files loose
      # makes GitHub's own zip the archive.
      - name: Package artefacts
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          STEM="${{ matrix.binary }}-${VERSION}-${{ matrix.platform }}"
          mkdir -p out

          # Every archive carries the licence texts. LGPLv3 section 4(b)
          # requires a copy to accompany the binary; a link is not enough.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a "out/${STEM}.zip" "./dist/${{ matrix.binary }}.exe" \
              ./LICENSE ./THIRD-PARTY-NOTICES.md ./licenses
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            ditto -c -k --keepParent "dist/${{ matrix.binary }}.app" \
              "out/${STEM}.zip" 2>/dev/null || \
              tar -czf "out/${STEM}.tar.gz" -C dist "${{ matrix.binary }}" \
                -C .. LICENSE THIRD-PARTY-NOTICES.md licenses
          else
            tar -czf "out/${STEM}.tar.gz" -C dist "${{ matrix.binary }}" \
              -C .. LICENSE THIRD-PARTY-NOTICES.md licenses
          fi

          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" >> "SHA256SUMS-${STEM}.txt"
            else
              shasum -a 256 "$f" >> "SHA256SUMS-${STEM}.txt"
            fi
          done
          ls -la

      - name: Collect artefacts (manual run)
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "dist/${{ matrix.binary }}.exe" out/
          elif [ -d "dist/${{ matrix.binary }}.app" ]; then
            cp -R "dist/${{ matrix.binary }}.app" out/
          else
            cp "dist/${{ matrix.binary }}" out/
          fi
          cp LICENSE THIRD-PARTY-NOTICES.md out/
          cp -R licenses out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.platform }}
          path: out/*
          retention-days: 14

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !inputs.dry_run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt || true
          rm -f SHA256SUMS-*.txt
          ls -la

      - name: Extract release notes from the changelog
        id: notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # Pull the section for this version out of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for ${VERSION}." > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          draft: false
          # A suffix such as 20260810-rc1 marks a prerelease; a bare
          # datestamp is a full release.
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          fail_on_unmatched_files: true
